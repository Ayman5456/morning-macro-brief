name: Publish Markets Brief

on:
  workflow_dispatch:
    inputs:
      brief_type:
        description: "Brief to generate"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - evening
      mode:
        description: "Output mode"
        required: true
        default: "both"
        type: choice
        options:
          - text
          - both

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: python -m pip install .

      - name: Restore previous brief artifacts
        uses: actions/cache@v4
        with:
          path: outputs
          key: brief-outputs-${{ github.run_id }}
          restore-keys: |
            brief-outputs-

      - name: Select commute mode
        id: select
        shell: bash
        run: |
          echo "brief_type=${{ inputs.brief_type }}" >> "$GITHUB_OUTPUT"
          echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          echo "Manual run selected: ${{ inputs.brief_type }} / ${{ inputs.mode }}"

      - name: Generate latest brief
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRIEF_TIMEZONE: Asia/Singapore
          BRIEF_AUDIO_FORMAT: aac
          BRIEF_KEEP_AUDIO_FILES: "1"
        run: python -m morning_brief.cli --brief-type "${{ steps.select.outputs.brief_type }}" --mode "${{ steps.select.outputs.mode }}" --audio-format aac --keep-audio 1 --delete-audio-segments

      - name: Export static site
        run: python -m morning_brief.static_site --output-dir outputs --site-dir site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
